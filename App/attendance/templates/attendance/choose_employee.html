{% extends 'base.html' %}

{% block title %}Choose Employee - Attendance System{% endblock %}

{% block extra_css %}
<style>nav.navbar{display:none;}</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Select Employee</h5></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="employee" class="form-label">Employee</label>
                        <select name="employee" id="employee" class="form-control" required>
                            {% for emp in employees %}
                                <option value="{{ emp.employee_id }}">{{ emp.get_full_name }} ({{ emp.employee_id }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
